name: App standard quality
# Version manifests only: routine source/PR pushes do not run quality (2026-10-01).
on:
  workflow_dispatch:
    inputs:
      full_regression:
        description: Run full tests and audits (default runs only the essential gate)
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ["package.json"]

permissions:
  contents: read
  # 변경 범위 판정(tools/ci-change-scope.mjs)이 이 workflow의 이전 성공 run을 조회한다.
  actions: read
concurrency:
  group: app-standard-portfolio-site-${{ github.ref }}
  cancel-in-progress: true
env:
  RELEASE_QUALITY: '1'

jobs:
  release-intent:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    outputs:
      run: ${{ steps.intent.outputs.run }}
      heavy: ${{ steps.scope.outputs.heavy }}
      runtimes: ${{ steps.scope.outputs.runtimes }}
    steps:
      # Keep the reviewed Dependabot v7 pin during standard projection; v7 hardens privileged PR checkout.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      # Admission executes repository code too: use the product's exact Node pin,
      # not the hosted runner's changing default (2026-10-08 consumer CI audit).
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
      - name: Admit only an increased release version
        id: intent
        run: node tools/release-quality.mjs
      - name: Check source prerequisites before setup
        if: steps.intent.outputs.run == 'true'
        run: node tools/deployment-preflight.mjs source
      # Decide before heavy jobs claim a runner slot. Only verified unchanged
      # behavior carries over; unknown history still admits the full checks.
      - name: Decide changed runtime scope
        id: scope
        if: steps.intent.outputs.run == 'true'
        run: node tools/ci-change-scope.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}

  quality:
    needs: release-intent
    # 기본은 hosted. 저장소 변수 CI_RUNNER를 설정한 저장소만 self-hosted로 간다.
    # 비워 두면 오늘과 동일하다. 켜기 전에 러너 여유 메모리와 이 게이트의 빌드
    # 피크를 비교한다(2026-09-10 실측 Next 피크 2358MB). public 저장소에는
    # 설정하지 않는다 - 포크 PR이 그 머신에서 코드를 실행한다.
    if: needs.release-intent.outputs.run == 'true' && (needs.release-intent.outputs.heavy == 'true')
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: portfolio-site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: portfolio-site
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: portfolio-site/.nvmrc
      # Markdown·expo.version만 바뀐 push는 검증된 이전 타입 결과를 승계한다(근거는 그 파일 머리 주석).
      - run: corepack enable
      - run: corepack prepare pnpm@11.24.0 --activate
      - run: pnpm install --frozen-lockfile
        if: ${{ needs.release-intent.outputs.heavy == 'true' }}
        working-directory: portfolio-site
      - name: Check installed prerequisites
        if: ${{ needs.release-intent.outputs.heavy == 'true' }}
        run: node tools/deployment-preflight.mjs dependencies
        env:
          CI_RUNTIME_IDS: ${{ needs.release-intent.outputs.runtimes }}
      - name: Changed runtime typecheck (manual dispatch includes regression)
        if: ${{ needs.release-intent.outputs.heavy == 'true' }}
        run: node tools/run-quality.mjs check-ci
        env:
          CI_RUNTIME_IDS: ${{ needs.release-intent.outputs.runtimes }}
          CI_FULL_REGRESSION: ${{ github.event_name == 'workflow_dispatch' && inputs.full_regression == true && '1' || '' }}
      - name: Source prerequisites (unchanged runtime checks carried over)
        if: ${{ needs.release-intent.outputs.heavy != 'true' }}
        run: node tools/deployment-preflight.mjs source
