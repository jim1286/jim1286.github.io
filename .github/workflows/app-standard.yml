name: App standard quality
# Version manifests only: routine source/PR pushes do not run quality (2026-10-01).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["package.json"]

permissions:
  contents: read
  # 변경 범위 판정(tools/ci-change-scope.mjs)이 이 workflow의 이전 성공 run을 조회한다.
  actions: read
concurrency:
  group: app-standard-portfolio-site-${{ github.ref }}
  cancel-in-progress: true
env:
  RELEASE_QUALITY: '1'

jobs:
  release-intent:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    outputs:
      run: ${{ steps.intent.outputs.run }}
    steps:
      # Keep the reviewed Dependabot v7 pin during standard projection; v7 hardens privileged PR checkout.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      # Admission executes repository code too: use the product's exact Node pin,
      # not the hosted runner's changing default (2026-10-08 consumer CI audit).
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
      - name: Admit only an increased release version
        id: intent
        run: node tools/release-quality.mjs

  quality:
    needs: release-intent
    if: needs.release-intent.outputs.run == 'true'
    # 기본은 hosted. 저장소 변수 CI_RUNNER를 설정한 저장소만 self-hosted로 간다.
    # 비워 두면 오늘과 동일하다. 켜기 전에 러너 여유 메모리와 이 게이트의 빌드
    # 피크를 비교한다(2026-09-10 실측 Next 피크 2358MB). public 저장소에는
    # 설정하지 않는다 - 포크 PR이 그 머신에서 코드를 실행한다.
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: portfolio-site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: portfolio-site
          # 변경 범위 판정이 게이트를 통과한 조상 커밋과 비교한다(그 조상은 임의로 멀 수 있다).
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: portfolio-site/.nvmrc
      # Markdown·expo.version만 바뀐 push는 무거운 검사를 건너뛰고 계약·문서 검사만 한다(근거는 그 파일 머리 주석).
      - name: Decide change scope
        id: scope
        run: node tools/ci-change-scope.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: corepack enable
      - run: corepack prepare pnpm@11.24.0 --activate
      - run: pnpm install --frozen-lockfile
        working-directory: portfolio-site
      - name: Contract and CI runtime checks (Flutter builds run locally)
        if: ${{ steps.scope.outputs.heavy == 'true' }}
        run: node tools/run-quality.mjs check-ci
      - name: Contract and documentation checks (heavy checks carried over)
        if: ${{ steps.scope.outputs.heavy != 'true' }}
        run: node tools/check-app-contract.mjs && node tools/check-doc-links.mjs
