# 단일 패키지 저장소. pnpm 11은 allowBuilds를 이 파일에서만 읽는다.
packages:
  - '.'

# pnpm 11은 의존성 postinstall을 기본 차단한다. esbuild는 postinstall로 플랫폼 바이너리를
# 내려받아야 vite build가 동작한다.
allowBuilds:
  esbuild: true

minimumReleaseAgeExclude:
  - '@hjmds/design-contracts@0.9.1 || 0.9.2 || 0.9.5 || 0.9.6 || 0.9.7 || 0.9.8'
  - '@hjmds/react@0.9.1 || 0.9.2 || 0.9.5 || 0.9.6 || 0.9.7 || 0.9.8'
