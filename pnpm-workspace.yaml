# 단일 패키지 저장소. pnpm 11은 allowBuilds를 이 파일에서만 읽는다.
packages:
  - '.'

# pnpm 11은 의존성 postinstall을 기본 차단한다. esbuild는 postinstall로 플랫폼 바이너리를
# 내려받아야 vite build가 동작한다.
allowBuilds:
  esbuild: true

# 새 버전을 예외 목록에 넣는 일은 사람이 한 번 보고 결정한다. strict를 켜지 않으면 pnpm이
# 설치 중에 minimumReleaseAgeExclude 항목을 묻지 않고 붙인다(2026-09-15 HJM 1.1.1 설치에서
# 6개 저장소가 그렇게 자동 추가됐다) — 그러면 "직접 게시하고 검증한 버전만 냉각을 건너뛴다"는
# 규칙이 자동 편집으로 비어 버린다. strict면 프롬프트가 떠서 그 판단이 남는다.
minimumReleaseAgeStrict: true

# 목록은 lockfile이 실제로 해석한 버전만 담는다. pnpm이 다음 해석부터 오래된 항목을 스스로
# 지운다 — 냉각이 지난 옛 버전의 예외는 아무 일도 하지 않으면서 목록만 길게 만들고, 그러면
# "직접 게시한 이 버전만 건너뛴다"는 규칙이 한눈에 안 읽힌다. 이력은 git 로그가 갖는다.
minimumReleaseAgeExcludePrune: true

minimumReleaseAgeExclude:
  - '@hjmds/design-contracts@1.2.0'
  - '@hjmds/react@1.2.0'
