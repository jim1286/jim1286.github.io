<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" role="img" aria-labelledby="title desc"><title id="title">작업을 끝까지 연결하는 여섯 단계</title><desc id="desc">요청에 필요한 영역을 고르고, 변경한 동작을 확인한 뒤 결과를 남깁니다.</desc><rect width="900" height="640" fill="white"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#315c49"/></marker></defs><path d="M410 100H480" fill="none" stroke="#315c49" stroke-width="2" marker-end="url(#a)"/><rect x="35" y="25" width="375" height="150" rx="16" fill="#f6f9f7" stroke="#b7c9be"/><text x="57" y="57" fill="#627568" font-family="sans-serif" font-size="12">01</text><text x="57" y="87" fill="#203c2f" font-family="sans-serif" font-size="20" font-weight="600">요청과 범위</text><text x="57" y="113" fill="#54665b" font-family="sans-serif" font-size="13">대상 제품과 앱·웹·서버 표면, 해결할 문제와 완료</text><text x="57" y="133" fill="#54665b" font-family="sans-serif" font-size="13">기준을 정합니다.</text><path d="M667 175V200H222V225" fill="none" stroke="#315c49" stroke-width="2" marker-end="url(#a)"/><rect x="480" y="25" width="375" height="150" rx="16" fill="#f6f9f7" stroke="#b7c9be"/><text x="502" y="57" fill="#627568" font-family="sans-serif" font-size="12">02</text><text x="502" y="87" fill="#203c2f" font-family="sans-serif" font-size="20" font-weight="600">원인과 소유권</text><text x="502" y="113" fill="#54665b" font-family="sans-serif" font-size="13">제품별 지침에서 실제 진입 코드로 들어가 공통 계약·제품</text><text x="502" y="133" fill="#54665b" font-family="sans-serif" font-size="13">코드·설정 중 원인을 소유한 위치를 찾습니다.</text><path d="M410 300H480" fill="none" stroke="#315c49" stroke-width="2" marker-end="url(#a)"/><rect x="35" y="225" width="375" height="150" rx="16" fill="#f6f9f7" stroke="#b7c9be"/><text x="57" y="257" fill="#627568" font-family="sans-serif" font-size="12">03</text><text x="57" y="287" fill="#203c2f" font-family="sans-serif" font-size="20" font-weight="600">구현과 연결</text><text x="57" y="313" fill="#54665b" font-family="sans-serif" font-size="13">환경 주입과 소스·빌드 결과의 소비 방식을 확인하고</text><text x="57" y="333" fill="#54665b" font-family="sans-serif" font-size="13">필요한 의존성만 준비합니다. 변경 계약을 사용하는 표면을</text><text x="57" y="353" fill="#54665b" font-family="sans-serif" font-size="13">함께 연결합니다.</text><path d="M667 375V400H222V425" fill="none" stroke="#315c49" stroke-width="2" marker-end="url(#a)"/><rect x="480" y="225" width="375" height="150" rx="16" fill="#f6f9f7" stroke="#b7c9be"/><text x="502" y="257" fill="#627568" font-family="sans-serif" font-size="12">04</text><text x="502" y="287" fill="#203c2f" font-family="sans-serif" font-size="20" font-weight="600">관련 검증</text><text x="502" y="313" fill="#54665b" font-family="sans-serif" font-size="13">관련 타입·동작·화면 검사와 테스트 수집 설정을</text><text x="502" y="333" fill="#54665b" font-family="sans-serif" font-size="13">고릅니다. 전체 회귀와 ExploreQA를 자동으로</text><text x="502" y="353" fill="#54665b" font-family="sans-serif" font-size="13">붙이지 않습니다.</text><path d="M410 500H480" fill="none" stroke="#315c49" stroke-width="2" marker-end="url(#a)"/><rect x="35" y="425" width="375" height="150" rx="16" fill="#f6f9f7" stroke="#b7c9be"/><text x="57" y="457" fill="#627568" font-family="sans-serif" font-size="12">05</text><text x="57" y="487" fill="#203c2f" font-family="sans-serif" font-size="20" font-weight="600">결과 기록</text><text x="57" y="513" fill="#54665b" font-family="sans-serif" font-size="13">구현·검증·배포 상태를 나누고 확인하지 못한 범위도</text><text x="57" y="533" fill="#54665b" font-family="sans-serif" font-size="13">남깁니다.</text><rect x="480" y="425" width="375" height="150" rx="16" fill="#f6f9f7" stroke="#b7c9be"/><text x="502" y="457" fill="#627568" font-family="sans-serif" font-size="12">06</text><text x="502" y="487" fill="#203c2f" font-family="sans-serif" font-size="20" font-weight="600">마무리</text><text x="502" y="513" fill="#54665b" font-family="sans-serif" font-size="13">이번 작업의 임시 자원을 정리하고 다른 작업과 사용자</text><text x="502" y="533" fill="#54665b" font-family="sans-serif" font-size="13">데이터를 보존합니다.</text></svg>