<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" role="img" aria-labelledby="title desc"><title id="title">요청에서 구현·검증까지</title><desc id="desc">대상 제품과 실행 표면에서 시작해 원인을 소유한 코드와 계약을 찾습니다. 필요한 영역만 선택하고 환경·의존 산출물을 준비한 뒤 변경한 소비 경로를 확인합니다. 배포와 탐색 QA는 요청된 경우에만 실행합니다.</desc><rect width="900" height="640" fill="white"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#315c49"/></marker></defs><path d="M410 100H480" fill="none" stroke="#315c49" stroke-width="2" marker-end="url(#a)"/><rect x="35" y="25" width="375" height="150" rx="16" fill="#f6f9f7" stroke="#b7c9be"/><text x="57" y="57" fill="#627568" font-family="sans-serif" font-size="12">01</text><text x="57" y="87" fill="#203c2f" font-family="sans-serif" font-size="20" font-weight="600">작업 요청</text><text x="57" y="113" fill="#54665b" font-family="sans-serif" font-size="13">목표 · 대상 제품 · 완료 기준</text><path d="M667 175V200H222V225" fill="none" stroke="#315c49" stroke-width="2" marker-end="url(#a)"/><rect x="480" y="25" width="375" height="150" rx="16" fill="#f6f9f7" stroke="#b7c9be"/><text x="502" y="57" fill="#627568" font-family="sans-serif" font-size="12">02</text><text x="502" y="87" fill="#203c2f" font-family="sans-serif" font-size="20" font-weight="600">공통 시작</text><text x="502" y="113" fill="#54665b" font-family="sans-serif" font-size="13">실제 표면 · 코드 위치 · 제품 지침</text><path d="M410 300H480" fill="none" stroke="#315c49" stroke-width="2" marker-end="url(#a)"/><rect x="35" y="225" width="375" height="150" rx="16" fill="#f6f9f7" stroke="#b7c9be"/><text x="57" y="257" fill="#627568" font-family="sans-serif" font-size="12">03</text><text x="57" y="287" fill="#203c2f" font-family="sans-serif" font-size="20" font-weight="600">영역 선택</text><text x="57" y="313" fill="#54665b" font-family="sans-serif" font-size="13">개발 · 데이터 · UI · 인증 · QA · 운영</text><path d="M667 375V400H222V425" fill="none" stroke="#315c49" stroke-width="2" marker-end="url(#a)"/><rect x="480" y="225" width="375" height="150" rx="16" fill="#f6f9f7" stroke="#b7c9be"/><text x="502" y="257" fill="#627568" font-family="sans-serif" font-size="12">04</text><text x="502" y="287" fill="#203c2f" font-family="sans-serif" font-size="20" font-weight="600">실행 연결 준비</text><text x="502" y="313" fill="#54665b" font-family="sans-serif" font-size="13">환경 주입 · 소스 / 빌드 결과</text><path d="M410 500H480" fill="none" stroke="#315c49" stroke-width="2" marker-end="url(#a)"/><rect x="35" y="425" width="375" height="150" rx="16" fill="#f6f9f7" stroke="#b7c9be"/><text x="57" y="457" fill="#627568" font-family="sans-serif" font-size="12">05</text><text x="57" y="487" fill="#203c2f" font-family="sans-serif" font-size="20" font-weight="600">변경 구현·관련 검사</text><text x="57" y="513" fill="#54665b" font-family="sans-serif" font-size="13">계약 소비 · 테스트 수집 범위</text><rect x="480" y="425" width="375" height="150" rx="16" fill="#f6f9f7" stroke="#b7c9be"/><text x="502" y="457" fill="#627568" font-family="sans-serif" font-size="12">06</text><text x="502" y="487" fill="#203c2f" font-family="sans-serif" font-size="20" font-weight="600">공통 마무리</text><text x="502" y="513" fill="#54665b" font-family="sans-serif" font-size="13">결과 · 미확인 범위 · 자원 정리</text></svg>