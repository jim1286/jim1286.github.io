<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" role="img" aria-labelledby="title desc"><title id="title">서버의 공통 책임과 선택 구성</title><desc id="desc">API와 업무 서비스에서 필요한 저장·캐시·별도 실행을 선택합니다. 영속 저장은 DB·파일·외부 저장소 등 실제 제품 구성을 따르며 큐가 없는 worker나 scheduler도 있습니다. API만 시작했다고 작업 처리까지 실행된 것은 아닙니다.</desc><rect width="900" height="640" fill="white"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#315c49"/></marker></defs><rect x="35" y="25" width="375" height="150" rx="16" fill="#f6f9f7" stroke="#b7c9be"/><text x="57" y="57" fill="#627568" font-family="sans-serif" font-size="12">01</text><text x="57" y="87" fill="#203c2f" font-family="sans-serif" font-size="20" font-weight="600">API · 인증 경계</text><text x="57" y="113" fill="#54665b" font-family="sans-serif" font-size="13">입력 검증 · 세션 · 오류 응답</text><rect x="480" y="25" width="375" height="150" rx="16" fill="#f6f9f7" stroke="#b7c9be"/><text x="502" y="57" fill="#627568" font-family="sans-serif" font-size="12">02</text><text x="502" y="87" fill="#203c2f" font-family="sans-serif" font-size="20" font-weight="600">업무 서비스</text><text x="502" y="113" fill="#54665b" font-family="sans-serif" font-size="13">권한 · 규칙 · 트랜잭션</text><rect x="35" y="225" width="375" height="150" rx="16" fill="#f6f9f7" stroke="#b7c9be"/><text x="57" y="257" fill="#627568" font-family="sans-serif" font-size="12">03</text><text x="57" y="287" fill="#203c2f" font-family="sans-serif" font-size="20" font-weight="600">영속 저장 · 필요 시</text><text x="57" y="313" fill="#54665b" font-family="sans-serif" font-size="13">DB · 파일 · 외부 저장소</text><rect x="480" y="225" width="375" height="150" rx="16" fill="#f6f9f7" stroke="#b7c9be"/><text x="502" y="257" fill="#627568" font-family="sans-serif" font-size="12">04</text><text x="502" y="287" fill="#203c2f" font-family="sans-serif" font-size="20" font-weight="600">조회 캐시 · 선택</text><text x="502" y="313" fill="#54665b" font-family="sans-serif" font-size="13">사용자 범위 · TTL · 무효화</text><rect x="35" y="425" width="375" height="150" rx="16" fill="#f6f9f7" stroke="#b7c9be"/><text x="57" y="457" fill="#627568" font-family="sans-serif" font-size="12">05</text><text x="57" y="487" fill="#203c2f" font-family="sans-serif" font-size="20" font-weight="600">작업 전달 · 선택</text><text x="57" y="513" fill="#54665b" font-family="sans-serif" font-size="13">큐 / DB 의도 · 입력·업무 키</text><rect x="480" y="425" width="375" height="150" rx="16" fill="#f6f9f7" stroke="#b7c9be"/><text x="502" y="457" fill="#627568" font-family="sans-serif" font-size="12">06</text><text x="502" y="487" fill="#203c2f" font-family="sans-serif" font-size="20" font-weight="600">별도 실행 · 선택</text><text x="502" y="513" fill="#54665b" font-family="sans-serif" font-size="13">worker / scheduler · 결과 저장</text></svg>